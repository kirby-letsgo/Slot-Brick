<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 158">
  <defs>
    <!-- The front rounds off into the sides: the left side turns to the light, the right one
         away from it. Black plastic, so a little light goes a long way. -->
    <linearGradient id="lit-side" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="24" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.04"/>
      <stop offset="0.2" stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="0.65" stop-color="#fff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="far-side" gradientUnits="userSpaceOnUse" x1="215" y1="0" x2="234" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="0.7" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="unlit-side" gradientUnits="userSpaceOnUse" x1="224" y1="0" x2="240" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </linearGradient>
    <!-- The top edge rounds over towards the light too. -->
    <linearGradient id="top" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1.6">
      <stop offset="0" stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- The sides' light fades out where the corners round off. -->
    <linearGradient id="ends" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="158">
      <stop offset="0.01" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.08" stop-color="#fff"/>
      <stop offset="0.92" stop-color="#fff"/>
      <stop offset="0.99" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="along">
      <rect width="240" height="158" fill="url(#ends)"/>
    </mask>
  </defs>
  <g mask="url(#along)">
    <rect width="24" height="158" fill="url(#lit-side)"/>
    <rect x="215" width="19" height="158" fill="url(#far-side)"/>
    <rect x="224" width="16" height="158" fill="url(#unlit-side)"/>
  </g>
  <rect width="240" height="1.6" fill="url(#top)"/>
  <!-- The label's recess, its bottom corners rounded. The light falls from the top left: the
       left wall is in shadow under a faint lip, the bottom and right walls are lit, and a dark
       crease runs where those meet the label. Across the top, the label turning over the edge
       is in shadow. -->
  <rect x="26.9" y="0.7" width="0.7" height="140.9" fill="#fff" fill-opacity="0.25"/>
  <path d="M 27.5 0.7 L 212.5 0.7 L 210 2 L 30.3 2 L 30.3 142.8 L 28.7 144.4 A 4 4 0 0 1 27.5 141.6 Z" fill="#000"/>
  <path d="M 28.7 144.4 L 29.5 143.6 L 210.7 143.6 L 210.7 1.64 L 212.5 0.7 L 212.5 141.6 A 4 4 0 0 1 208.5 145.6 L 31.5 145.6 A 4 4 0 0 1 28.7 144.4 Z" fill="#fff" fill-opacity="0.75"/>
  <path d="M 30.3 142.6 L 209.5 142.6 L 209.5 2 L 210.7 2 L 210.7 143.6 L 29.5 143.6 Z" fill="#000" fill-opacity="0.75"/>
</svg>
